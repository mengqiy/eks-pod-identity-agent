{{- $top := . -}}
{{- range $_, $daemonset := .Values.daemonsets -}}
{{- if $daemonset.create -}}
{{- $valuesDict := dict "nameSuffix" $daemonset.nameSuffix "Values" $top.Values "Release" $top.Release "Chart" $top.Chart -}}
{{- $selectorLabels := include "eks-pod-identity-agent.selectorLabels" $valuesDict -}}
{{- $affinity := default $top.Values.affinity $daemonset.affinity -}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "eks-pod-identity-agent.fullname" $valuesDict }}
  namespace: {{ $top.Release.Namespace }}
  labels:
    {{- include "eks-pod-identity-agent.labels" $valuesDict | nindent 4}}
spec:
  updateStrategy:
    {{- toYaml $top.Values.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- $selectorLabels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $selectorLabels | nindent 8 }}
        {{- with $top.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $top.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: true
      priorityClassName: {{ $top.Values.priorityClassName }}
      {{- with (include "eks-pod-identity-agent.serviceAccountName" $top) }}
      serviceAccountName: {{ . }}
      {{- end }}
      hostNetwork: true
      terminationGracePeriodSeconds: 30
      {{- with $top.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $top.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $top.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $top.Values.init.create }}
      initContainers:
        - name: {{ $top.Chart.Name }}-init
          image: {{ include "eks-pod-identity-agent.image" $ }}
          imagePullPolicy: {{ $top.Values.image.pullPolicy }}
          command: {{ $top.Values.init.command }}
          {{- if $top.Values.init.additionalArgs }}
          args:
            {{- range $key, $value := $top.Values.init.additionalArgs }}
            - {{ $key | quote }}
            - {{ $value | quote }}
            {{- end }}
          {{- end }}
          securityContext:
            privileged: true
      {{- end }}
      containers:
        - name: {{ $top.Chart.Name }}
          image: {{ include "eks-pod-identity-agent.image" $ }}
          imagePullPolicy: {{ $top.Values.image.pullPolicy }}
          command: {{ $top.Values.agent.command }}
          args:
            - "--port"
            - "80"
            - "--cluster-name"
            - {{ $top.Values.clusterName | quote }}
            - "--probe-port"
            - {{ $top.Values.agent.probePort | quote }}
            {{- if $top.Values.metrics.enabled }}
            - "--metrics-port"
            - {{ $top.Values.metrics.port | quote }}
            {{- end }}
            {{- range $key, $value := $top.Values.agent.additionalArgs }}
            - {{ $key | quote }}
            - {{ $value | quote }}
            {{- end }}
            {{- range $key, $value := $daemonset.additionalArgs }}
            - {{ $key | quote }}
            - {{ $value | quote }}
            {{- end }}
          ports:
            {{- if $top.Values.agent.advertiseProxyPort }}
            - containerPort: 80
              protocol: TCP
              name: proxy
            {{- end }}
            - containerPort: {{ $top.Values.agent.probePort }}
              protocol: TCP
              name: probes-port
           {{- if $top.Values.metrics.enabled }}
            - containerPort: {{ $top.Values.metrics.port }}
              protocol: TCP
              name: metrics
            {{- end }}
          env:
          {{- range $key, $value := $top.Values.env }}
          - name: {{ $key }}
            value: {{ $value | quote }}
          {{- end }}
          {{- if contains "-iso" $top.Values.env.AWS_REGION }}
          - name: AWS_CA_BUNDLE
            value: /etc/pki/tls/certs/ca-bundle.crt
          {{- end }}
          {{- /* The CSI node ID. From the downward API so registration waits on no API call. */}}
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          volumeMounts:
          {{- if contains "-iso" $top.Values.env.AWS_REGION }}
          - name: ca-bundle
            mountPath: /etc/pki/tls/certs/ca-bundle.crt
            readOnly: true
          {{- end }}
          {{- /*
          Workload identity CSI mounts, each at its host path. That equality is
          load-bearing: the endpoint reported at registration is opened by the kubelet in
          the host mount namespace and bound by the agent in its own. See
          configuration.KubeletPluginDir.
          */}}
          - name: workload-identity-socket-dir
            mountPath: /var/run/secrets/pods.eks.amazonaws.com/workloadidentity
          - name: csi-plugin-dir
            mountPath: /var/lib/kubelet/plugins/spiffe.csi.eks.amazonaws.com
          - name: csi-plugin-registration-dir
            mountPath: /var/lib/kubelet/plugins_registry
          {{- /*
          Bidirectional is the reason this container is privileged: the agent mounts in its
          own namespace and the kubelet must see it in the host's. With any other
          propagation the publish succeeds, the kubelet finds an empty directory, and the
          pod starts with no socket. Kubernetes allows Bidirectional only for a privileged
          container.
          */}}
          - name: kubelet-pods-dir
            mountPath: /var/lib/kubelet/pods
            mountPropagation: Bidirectional
          {{- if $daemonset.volumeMounts }}
          {{- toYaml $daemonset.volumeMounts | nindent 10}}
          {{- end }}
          securityContext:
            {{- /*
            Required by the Bidirectional propagation above and by mount(2). The
            capability below is kept so the intent survives if the mount ever moves out of
            this container; privileged already implies it.
            */}}
            privileged: true
            capabilities:
              add:
                - CAP_NET_BIND_SERVICE
            {{- with $daemonset.additionalSecurityContext }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml $top.Values.resources | nindent 12 }}
          {{- if $top.Values.agent.livenessEndpoint }}
          livenessProbe:
            failureThreshold: 3
            httpGet:
              host: localhost
              path: {{ $top.Values.agent.livenessEndpoint }}
              port: probes-port
              scheme: HTTP
            initialDelaySeconds: 30
            timeoutSeconds: 10
          {{- end }}
          {{- if $top.Values.agent.readinessEndpoint }}
          readinessProbe:
            failureThreshold: 30
            httpGet:
              host: localhost
              path: {{ $top.Values.agent.readinessEndpoint }}
              port: probes-port
              scheme: HTTP
            initialDelaySeconds: 1
            timeoutSeconds: 10
          {{- end }}
      volumes:
        {{- if contains "-iso" $top.Values.env.AWS_REGION }}
        - name: ca-bundle
          hostPath:
            path: /etc/pki/tls/certs/ca-bundle.crt
            type: File
        {{- end }}
        {{- /*
        The socket directory is on the host so the bind mount has something outside this
        container's namespace to publish. Created if absent: on a first boot nothing else
        makes it.
        */}}
        - name: workload-identity-socket-dir
          hostPath:
            path: /var/run/secrets/pods.eks.amazonaws.com/workloadidentity
            type: DirectoryOrCreate
        {{- /* Holds the CSI plugin socket. DirectoryOrCreate: the kubelet does not make it. */}}
        - name: csi-plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/spiffe.csi.eks.amazonaws.com
            type: DirectoryOrCreate
        {{- /* Watched by the kubelet. A socket here is the only thing advertising the driver. */}}
        - name: csi-plugin-registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: DirectoryOrCreate
        {{- /*
        Where every publish target lives. Strict Directory, unlike the two above: the
        kubelet creates this on a node that runs pods, so its absence means the kubelet
        root is elsewhere and the agent would publish into a directory nothing reads.
        */}}
        - name: kubelet-pods-dir
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
        {{- if $daemonset.volumes }}
        {{- toYaml $daemonset.volumes | nindent 8}}
        {{- end }}
{{ end }}
{{ end }}