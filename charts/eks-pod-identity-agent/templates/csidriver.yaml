{{- /*
The cluster-scoped CSIDriver object for the workload identity socket.

Unconditional and with no values knob: this chart is what the EKS managed add-on
installs, so it is always the owner, and on a cluster not using workload identity the
object is inert because only pods the webhook enrolls mount the driver.

attachRequired and podInfoOnMount are immutable after creation, so a future version
wanting different values needs the object deleted and recreated. The rest is mutable.
*/}}
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  # Must equal configuration.WorkloadIdentityCSIDriver and the driver the Pod Identity
  # webhook names on an enrolled pod's volume. Pinned by
  # TestChartCSIDriverMatchesFrozenContract.
  name: spiffe.csi.eks.amazonaws.com
  labels:
  {{- include "eks-pod-identity-agent.labels" . | nindent 4 }}
spec:
  # A node-local bind mount: nothing for the attach/detach controller to do.
  attachRequired: false
  # The node service needs the pod's identity in the volume context to publish.
  podInfoOnMount: true
  # Inline ephemeral only. No PersistentVolume for this driver.
  volumeLifecycleModes:
    - Ephemeral
  # Read-only bind mount, nothing to chown.
  fsGroupPolicy: None
  # Why this object must exist before the agent can mint, and why the chart owns it:
  # Kubernetes 1.33's ServiceAccountNodeAudienceRestriction only permits a node identity
  # to mint a ServiceAccount token for an audience the target pod already references,
  # either through a projected serviceAccountToken volume or through the tokenRequests of
  # a CSI driver it mounts. Enrolled pods mount this driver, so one declaration covers the
  # fleet with no pod spec change.
  #
  # Matches configuration.EksAuthAudience. Side effect: kubelet mints a token for this
  # audience on every publish and passes it in the volume context. The node service
  # ignores it; the agent mints its own, bound to the pod.
  tokenRequests:
    - audience: pods.eks.amazonaws.com
